<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RentPing{% endblock %}</title>
<style>
  :root {
    --ink: #0f172a; --ink-soft: #334155; --muted: #64748b; --faint: #94a3b8;
    --line: #e2e8f0; --bg: #f6f8fc; --card: #ffffff;
    --brand: #4f46e5; --brand-dark: #4338ca; --brand-soft: #eef2ff;
    --ok: #047857; --ok-bg: #d1fae5;
    --warn: #92400e; --warn-bg: #fef3c7;
    --bad: #b91c1c; --bad-bg: #fee2e2;
    --info: #1d4ed8; --info-bg: #dbeafe;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(15,23,42,.05), 0 8px 24px -12px rgba(15,23,42,.12);
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
         margin: 0; color: var(--ink); background: var(--bg); line-height: 1.55;
         -webkit-font-smoothing: antialiased; }
  a { color: var(--brand); }

  /* ---------- top nav ---------- */
  .topbar { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.88);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 1120px; margin: 0 auto; padding: 0 24px; height: 62px;
                  display: flex; align-items: center; justify-content: space-between; }
  .logo { font-weight: 800; font-size: 1.25em; color: var(--ink); text-decoration: none;
          display: flex; align-items: center; gap: 8px; letter-spacing: -.02em; }
  .logo .mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--brand), #7c3aed);
                display: inline-flex; align-items: center; justify-content: center; font-size: 16px; }
  .nav { display: flex; align-items: center; gap: 4px; }
  .nav a { margin-left: 4px; text-decoration: none; color: var(--ink-soft); font-weight: 500;
           font-size: .95em; padding: 8px 14px; border-radius: 9px; }
  .nav a:hover { background: #f1f5f9; color: var(--ink); }
  .nav a.active { background: var(--brand-soft); color: var(--brand-dark); }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 24px 64px; }

  /* ---------- page header ---------- */
  .page-head { display: flex; align-items: flex-start; justify-content: space-between;
               gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .page-head h1 { margin: 0 0 4px; font-size: 1.7em; letter-spacing: -.02em; }
  .page-head .sub { color: var(--muted); margin: 0; font-size: 1em; }

  /* ---------- cards & stats ---------- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 22px; margin: 0 0 20px; box-shadow: var(--shadow); }
  .card h2 { margin: 0 0 14px; font-size: 1.12em; letter-spacing: -.01em; }
  .card h2 .sub { font-weight: 400; color: var(--muted); font-size: .82em; margin-left: 8px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
           gap: 14px; margin-bottom: 24px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 18px 20px; box-shadow: var(--shadow); }
  .stat .label { font-size: .8em; text-transform: uppercase; letter-spacing: .06em;
                 color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .stat .value { font-size: 1.9em; font-weight: 750; letter-spacing: -.03em; line-height: 1.1; }
  .stat .detail { color: var(--muted); font-size: .88em; margin-top: 4px; }
  .progress { height: 7px; background: #eef2f7; border-radius: 99px; margin-top: 10px; overflow: hidden; }
  .progress i { display: block; height: 100%; border-radius: 99px;
                background: linear-gradient(90deg, var(--brand), #7c3aed); }

  /* ---------- tables ---------- */
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; padding: 10px 12px; font-size: .78em; text-transform: uppercase;
       letter-spacing: .06em; color: var(--muted); font-weight: 650;
       border-bottom: 1px solid var(--line); background: #f8fafc; }
  th:first-child { border-radius: 8px 0 0 0; } th:last-child { border-radius: 0 8px 0 0; }
  td { text-align: left; padding: 11px 12px; border-bottom: 1px solid #f1f5f9; font-size: .95em; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: #fafbff; }
  .tenant-name { font-weight: 600; }
  .tenant-phone { color: var(--muted); font-size: .88em; }

  /* ---------- pills ---------- */
  .pill { border-radius: 999px; padding: 3px 12px; font-size: .8em; font-weight: 650;
          display: inline-block; white-space: nowrap; }
  .paid { background: var(--ok-bg); color: var(--ok); }
  .late { background: var(--bad-bg); color: var(--bad); }
  .due { background: var(--warn-bg); color: var(--warn); }
  .upcoming { background: var(--info-bg); color: var(--info); }
  .muted { background: #f1f5f9; color: var(--muted); }

  /* ---------- buttons & forms ---------- */
  .btn { background: var(--brand); color: #fff; border: 0; border-radius: 10px;
         padding: 11px 20px; font-size: .96em; font-weight: 600; cursor: pointer;
         text-decoration: none; display: inline-block; transition: background .15s; }
  .btn:hover { background: var(--brand-dark); color: #fff; }
  .btn-ghost { background: #f1f5f9; color: var(--ink-soft); }
  .btn-ghost:hover { background: #e2e8f0; color: var(--ink); }
  .btn-sm { padding: 6px 12px; font-size: .85em; border-radius: 8px; }
  .btn-danger-ghost { background: transparent; color: var(--faint); }
  .btn-danger-ghost:hover { background: var(--bad-bg); color: var(--bad); }
  input, textarea, select { padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 9px;
                            font-size: .96em; margin: 4px 0; background: #fff; color: var(--ink); }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--brand-soft);
                            border-color: var(--brand); }
  form.inline { display: inline; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
               gap: 10px 14px; align-items: end; margin-top: 12px;
               background: #f8fafc; border: 1px dashed var(--line); border-radius: 10px; padding: 14px 16px; }
  .form-grid label { display: flex; flex-direction: column; font-size: .82em; color: var(--muted);
                     font-weight: 550; gap: 2px; }
  .actions { display: flex; gap: 6px; justify-content: flex-end; white-space: nowrap; }

  /* ---------- banners ---------- */
  .banner { border-radius: 12px; padding: 13px 18px; margin-bottom: 20px; font-size: .95em;
            display: flex; align-items: center; gap: 10px; }
  .banner-ok { background: var(--ok-bg); border: 1px solid #6ee7b7; color: #065f46; }
  .banner-info { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }

  /* ---------- property sections ---------- */
  .prop-head { display: flex; align-items: baseline; justify-content: space-between;
               flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .prop-head h2 { margin: 0; }
  .prop-addr { color: var(--muted); font-size: .92em; }
  .unit-block { margin-top: 18px; }
  .unit-title { font-weight: 700; font-size: 1em; margin: 0 0 6px; color: var(--ink-soft);
                display: flex; align-items: center; gap: 8px; }
  .unit-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* ---------- message log ---------- */
  .msg-body { max-width: 480px; color: var(--ink-soft); }
  .dir { font-weight: 700; }
  .dir-out { color: var(--brand); } .dir-in { color: var(--ok); }

  .empty { color: var(--muted); text-align: center; padding: 28px 12px; font-size: .95em; }
  .empty .big { font-size: 2em; display: block; margin-bottom: 8px; }

  footer { max-width: 1120px; margin: 0 auto; padding: 0 24px 32px; color: var(--faint);
           font-size: .85em; }
  @media (max-width: 640px) {
    .actions { justify-content: flex-start; }
    .page-head h1 { font-size: 1.4em; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="/"><span class="mark">🔔</span>RentPing</a>
    <nav class="nav">
      {% if landlord %}
        <a href="/dashboard" class="{% if request.url.path == '/dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">Messages</a>
        <a href="/billing" class="{% if request.url.path == '/billing' %}active{% endif %}">Billing</a>
        <form class="inline" method="post" action="/logout"><button class="btn btn-ghost btn-sm" style="margin-left:8px">Log out</button></form>
      {% else %}
        <a href="/login">Log in</a><a class="btn btn-sm" href="/signup" style="margin-left:8px">Start free trial</a>
      {% endif %}
    </nav>
  </div>
</div>
<div class="wrap">
{% block content %}{% endblock %}
</div>
<footer>RentPing · automated rent reminders by text message{% if demo %} · demo mode: texts are simulated{% endif %}</footer>
</body>
</html>
